name: "NovaMail patched image"

# Builds the patched Inbox Zero web image for the home-lab server (amd64 only)
# on GitHub's runner, so the build never runs on the server itself.
on:
  push:
    branches: ["fix/gmail-rate-limit"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: github.repository == 'mattgrisafi/inbox-zero'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Free runner disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.prod
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/mattgrisafi/inbox-zero:${{ github.sha }}
            ghcr.io/mattgrisafi/inbox-zero:patched
          cache-from: type=gha
          cache-to: type=gha,mode=max
